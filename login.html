<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión Admin - Detalles que Celebran</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo-container">
                <img src="logo.jpg" alt="Logo" class="logo-img">
                <span>Detalles que Celebran</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="form-container" style="max-width: 400px; margin-top: 3rem;">
            <h1 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary);">Acceso Administrador</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="admin-email">Correo Electrónico</label>
                    <input type="email" id="admin-email" required placeholder="admin@correo.com">
                </div>
                <div class="form-group">
                    <label for="admin-password">Contraseña</label>
                    <input type="password" id="admin-password" required placeholder="********">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Ingresar</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Detalles que Celebran. Hecho con cariño</p>
    </footer>
    <script src="api.js"></script>
    <script src="admin.js"></script>
</body>
</html>
